name: Workspace agent
on:
  push:
    paths: ['tools/workspace-agent/**', 'distribution/deployment/**', 'Containerfile', 'tests/test_workspace_deployment.py', '.github/workflows/workspace-agent.yml']
  pull_request:
    paths: ['tools/workspace-agent/**', 'distribution/deployment/**', 'Containerfile', 'tests/test_workspace_deployment.py', '.github/workflows/workspace-agent.yml']
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go test ./...
        working-directory: tools/workspace-agent
      - run: docker build -f Containerfile --target deployment-kit-candidate -t workspace-kit:test .
      - run: docker run --rm --entrypoint sh workspace-kit:test -c 'cd /bundle && sha256sum -c workspace-agent-SHA256SUMS'
      - run: python -m pip install pyyaml pytest
      - run: python -m pytest -q tests/test_workspace_deployment.py tests/test_deployment_ownership.py
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Run native Windows host agent tests
        run: go test ./...
        working-directory: tools/workspace-agent
      - run: ./scripts/test_deployment_launchers.ps1
        shell: pwsh
