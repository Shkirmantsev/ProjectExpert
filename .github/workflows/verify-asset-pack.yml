name: verify-asset-pack
on:
  push:
    paths:
      - 'distribution/deployment/**'
      - 'pi_platform/deployment/**'
      - 'tests/windows_deployment_runtime.ps1'
      - '.github/workflows/verify-asset-pack.yml'
  pull_request:
    paths:
      - 'distribution/deployment/**'
      - 'pi_platform/deployment/**'
      - 'tests/windows_deployment_runtime.ps1'
      - '.github/workflows/verify-asset-pack.yml'
  workflow_dispatch:
    inputs:
      asset_image:
        description: Reviewed asset OCI image with immutable sha256 digest
        required: true
      manifest_sha256:
        description: Independently reviewed manifest SHA-256
        required: true
permissions:
  contents: read
jobs:
  verify-seeding-offline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ASSET_IMAGE: ${{ inputs.asset_image }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable identities before pull
        shell: bash
        run: |
          [[ "$ASSET_IMAGE" =~ ^ghcr.io/shkirmantsev/project-intelligence-assets@sha256:[0-9a-f]{64}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Pull candidate through engine registry trust
        run: docker pull "$ASSET_IMAGE"
      - name: Seed twice with networking denied
        run: |
          docker volume create candidate-assets
          docker run --rm --network none -v candidate-assets:/models "$ASSET_IMAGE" --manifest-sha256 "$MANIFEST_SHA256"
          docker run --rm --network none -v candidate-assets:/models "$ASSET_IMAGE" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Remove isolated candidate cache
        if: always()
        run: docker volume rm candidate-assets
  windows-launcher-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 native stderr and exit contract
        shell: powershell
        run: ./tests/windows_deployment_runtime.ps1
      - name: PowerShell 7 native stderr and exit contract
        shell: pwsh
        run: ./tests/windows_deployment_runtime.ps1
