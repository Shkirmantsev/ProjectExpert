name: verify-asset-pack
on:
  push:
    paths:
      - 'distribution/deployment/**'
      - 'distribution/assets/**'
      - 'scripts/materialize_asset_pack.py'
      - 'scripts/verify_offline_runtime.py'
      - 'pi_platform/deployment/**'
      - 'tests/windows_deployment_runtime.ps1'
      - 'tests/windows_offline_assets.ps1'
      - 'tests/windows_container_cuda.ps1'
      - '.github/workflows/verify-asset-pack.yml'
  pull_request:
    paths:
      - 'distribution/deployment/**'
      - 'distribution/assets/**'
      - 'scripts/materialize_asset_pack.py'
      - 'scripts/verify_offline_runtime.py'
      - 'pi_platform/deployment/**'
      - 'tests/windows_deployment_runtime.ps1'
      - 'tests/windows_offline_assets.ps1'
      - 'tests/windows_container_cuda.ps1'
      - '.github/workflows/verify-asset-pack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-seeding-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the reviewed release on every promotion path
        run: |
          python -m pi_platform.deployment.offline_assets --release distribution/assets/asset-release.json > /tmp/release.json
          python - <<'PYCODE'
          import json, os
          release = json.load(open('/tmp/release.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ASSET_IMAGE=' + release['image'] + '\n')
              output.write('MANIFEST_SHA256=' + release['manifest_sha256'] + '\n')
          PYCODE
      - name: Pull candidate through engine registry trust
        run: docker pull "$ASSET_IMAGE"
      - name: Seed twice with networking denied
        run: |
          docker volume create candidate-assets
          docker run --rm --network none -v candidate-assets:/models "$ASSET_IMAGE" --manifest-sha256 "$MANIFEST_SHA256"
          docker run --rm --network none -v candidate-assets:/models "$ASSET_IMAGE" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Remove isolated candidate cache
        if: always()
        run: docker volume rm candidate-assets
  windows-launcher-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 native stderr and exit contract
        shell: powershell
        run: ./tests/windows_deployment_runtime.ps1
      - name: PowerShell 7 native stderr and exit contract
        shell: pwsh
        run: ./tests/windows_deployment_runtime.ps1
      - name: Windows PowerShell 5.1 offline native extraction contract
        shell: powershell
        run: ./tests/windows_offline_assets.ps1
      - name: PowerShell 7 offline native extraction contract
        shell: pwsh
        run: ./tests/windows_offline_assets.ps1
      - name: Windows PowerShell 5.1 container CUDA preference and fallback
        shell: powershell
        run: ./tests/windows_container_cuda.ps1
      - name: PowerShell 7 container CUDA preference and fallback
        shell: pwsh
        run: ./tests/windows_container_cuda.ps1
