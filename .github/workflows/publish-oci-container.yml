name: publish-oci-container

on:
  push:
    branches:
      - dev
      - development
      - main
  pull_request:
    branches:
      - dev
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: project-intelligence

jobs:
  windows-launchers:
    name: Windows PowerShell deployment contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Windows PowerShell 5 launcher behavior
        shell: powershell
        run: ./scripts/test_deployment_launchers.ps1

  verify-platform:
    name: Verify Platform Product Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install platform package (product only)
        run: python -m pip install --no-cache-dir .

      - name: Run license gate
        run: python -m pi_platform.cli license-gate

      - name: Run quality gates and metrics gate
        run: |
          python -m pi_platform.cli eval
          python -m pi_platform.cli metrics-gate
          python -m pi_platform.cli invariants
          python -m pi_platform.cli metrics-gate

      - name: Run Tier-3 retrieval evaluation and chunk-size sweep
        run: |
          python -m pi_platform.cli eval-retrieval --no-baseline
          python -m pi_platform.cli eval-chunk-size-sweep

      - name: Verify deterministic agent plugin packaging
        run: python -m pi_platform.cli package-plugins --output-root tmp/local/dist-check

      - name: Validate product docker-compose profiles
        run: |
          for profile in production core-headless desktop-lite desktop-local-ai open-webui enterprise; do
            docker compose -f docker-compose.yml --profile "$profile" config -q
          done

  build-and-publish-oci:
    name: Build, Smoke-Test, and Publish OCI Image
    needs: [verify-platform, windows-launchers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image owner to lowercase
        id: owner
        run: |
          owner_lc="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          printf 'image=%s/%s/%s\n' "$REGISTRY" "$owner_lc" "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.owner.outputs.image }}
          tags: |
            type=raw,value=core
            type=sha,prefix=core-sha-,format=long
            type=ref,event=branch,prefix=core-
            type=ref,event=pr,prefix=core-

      - name: Build local candidate image for end-to-end smoke verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: core
          load: true
          tags: ${{ steps.owner.outputs.image }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify standalone OCI container capabilities and isolation
        env:
          PI_IMAGE: ${{ steps.owner.outputs.image }}:smoke
          PI_PROFILE: core-headless
          PI_CONTROL_PORT: "8765"
        run: |
          set -euo pipefail

          # 1. Verify no development harness artefacts exist inside the image
          docker run --rm --entrypoint python "$PI_IMAGE" -c "
          import pathlib, sys
          root = pathlib.Path('/opt/project-intelligence')
          forbidden = ['harness.py', 'infra', 'tools', '.ai', '.agents', 'openspec', 'scripts']
          leaked = [name for name in forbidden if (root / name).exists()]
          if leaked:
              sys.exit(f'Harness files leaked into product container: {leaked}')
          required = ['pi_platform', 'distribution/okf-profile', 'distribution/skills', 'distribution/codex', 'distribution/claude-code', 'distribution/opencode', 'distribution/generic-agent', 'evals/corpus/golden_queries.yaml']
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              sys.exit(f'Required product runtime files missing from container: {missing}')
          "

          # 2. Prepare a synthetic target repository to mount at /repo
          target_repo="$(mktemp -d)"
          git init -q "$target_repo"
          git -C "$target_repo" config user.email "ci@example.com"
          git -C "$target_repo" config user.name "CI Smoke"
          echo "# Synthetic Target Project" > "$target_repo/README.md"
          git -C "$target_repo" add README.md
          git -C "$target_repo" commit -q -m "initial target commit"

          # Scaffold canonical tree inside the container against /repo
          docker run --rm -v "$target_repo:/repo:rw" "$PI_IMAGE" init-project --target /repo

          # 3. Boot via docker compose and verify readiness + full capability surface
          export PI_TARGET_REPO="$target_repo"
          docker compose -f docker-compose.yml --profile "$PI_PROFILE" up -d
          trap 'docker compose -f docker-compose.yml --profile "$PI_PROFILE" down -v || true; sudo rm -rf "$target_repo" 2>/dev/null || rm -rf "$target_repo" || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PI_CONTROL_PORT}/health/ready" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f docker-compose.yml --profile "$PI_PROFILE" logs
            exit 1
          fi

          # Verify CLI readiness check inside running container
          docker compose -f docker-compose.yml --profile "$PI_PROFILE" exec -T core \
            python -m pi_platform.cli health --ready --target /repo

          # Verify UI root, REST API, and MCP JSON-RPC surface
          curl -fsS "http://127.0.0.1:${PI_CONTROL_PORT}/" | grep -q "Project Intelligence"
          curl -fsS "http://127.0.0.1:${PI_CONTROL_PORT}/api/v1/project-version" | grep -q '"head"'
          curl -fsS "http://127.0.0.1:${PI_CONTROL_PORT}/api/v1/indexing-status" | grep -q '"ready": true'
          curl -fsS -X POST "http://127.0.0.1:${PI_CONTROL_PORT}/api/v1/query" \
            -H "Content-Type: application/json" \
            -d '{"text": "Project Knowledge Index"}' | grep -q '"results"'
          curl -fsS -X POST "http://127.0.0.1:${PI_CONTROL_PORT}/mcp" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' | grep -q '"project.search"'

      - name: Push OCI container image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-and-deployment:
    name: Verify and publish production with deployment kit
    needs: [verify-platform, windows-launchers]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the exact production redistribution review before building
        run: |
          python -m pi_platform.cli license-gate \
            --inventory distribution/licenses/production-dependency-inventory.json \
            --production-lock requirements-production-linux-x86_64.txt \
            --license-review distribution/licenses/production-license-review.json \
            --license-evidence distribution/licenses/production-license-evidence.json
      - name: Set image names
        id: names
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project-intelligence"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "kit=$image-deployment" >> "$GITHUB_OUTPUT"
          echo "channel=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build production candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: ${{ steps.names.outputs.image }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
      - name: Real default model download, inference, startup and restart
        run: python scripts/smoke_production_container.py --image '${{ steps.names.outputs.image }}:candidate-${{ github.sha }}'
      - name: Verify optional GGUF runtime with real CPU inference
        run: |
          python scripts/smoke_gguf_container.py
          python scripts/smoke_gguf_container.py --model gemma-gguf
      - name: Build and test deployment kit export
        run: |
          docker build -f Containerfile --target deployment-kit -t deployment-kit:test .
          destination="$(mktemp -d)"
          docker run --rm -v "$destination:/deployment" deployment-kit:test
          test -f "$destination/.project-intelligence-deploy/Makefile"
          docker compose --env-file "$destination/.project-intelligence-deploy/deployment.env" -f "$destination/.project-intelligence-deploy/compose.yaml" config -q
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'development' || github.ref_name == 'main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image and capture its immutable digest
        id: published
        if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'development' || github.ref_name == 'main')
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE:candidate-$GITHUB_SHA" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          echo "reference=$digest" >> "$GITHUB_OUTPUT"
      - name: Publish matching deployment kit
        if: steps.published.outputs.reference != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: deployment-kit
          push: true
          build-args: |
            PI_DEPLOY_IMAGE=${{ steps.published.outputs.reference }}
          tags: |
            ${{ steps.names.outputs.kit }}:sha-${{ github.sha }}
            ${{ steps.names.outputs.kit }}:${{ steps.names.outputs.channel }}
      - name: Promote verified production aliases
        if: steps.published.outputs.reference != ''
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in production "$GITHUB_REF_NAME"; do
            docker tag "$IMAGE:candidate-$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
