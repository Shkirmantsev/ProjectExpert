name: verify-production-runtime

# Heavy real-model verification is deliberately separate from the model-free CI.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-production-runtime.yml'
      - 'scripts/smoke_gguf_container.py'
      - 'pi_platform/deployment/**'
      - 'distribution/assets/**'
  push:
    branches: [dev, development, main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      candidate_assets:
        description: Verify an unpromoted reviewed candidate (never publish)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  full-regression:
    uses: ./.github/workflows/verify.yml

  published-assets:
    if: github.event_name != 'pull_request' && inputs.candidate_assets != true
    uses: ./.github/workflows/publish-offline-assets.yml
    secrets: inherit

  real-production-runtime:
    needs: [full-regression, published-assets]
    if: >-
      ${{ !cancelled() && needs.full-regression.result == 'success' &&
          (github.event_name == 'pull_request' || inputs.candidate_assets == true ||
           needs.published-assets.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PI_RUN_MODEL_TESTS: "1"
      PI_RUN_PDF_TESTS: "1"
      PI_EMBEDDING_DEVICE: cpu
      HF_HOME: ${{ github.workspace }}/tmp/local/model-cache
      PI_MODEL_CACHE: ${{ github.workspace }}/tmp/local/model-cache
      PI_ASSET_CACHE: ${{ github.workspace }}/tmp/local/model-cache
      PI_REQUIRE_OFFLINE_ASSETS: "1"
      PI_ALLOW_REMOTE_ASSET_DOWNLOADS: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PI_LLAMA_ENDPOINT: http://127.0.0.1:8769
      PI_LLAMA_API_KEY_FILE: ${{ github.workspace }}/tmp/local/model-cache/llama-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && inputs.candidate_assets != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare reviewed candidate or consume the automatic registry output
        env:
          CANDIDATE_ASSETS: ${{ github.event_name == 'pull_request' || inputs.candidate_assets == true }}
          PUBLISHED_ASSET_IMAGE: ${{ needs.published-assets.outputs.image }}
          # Upstream access exists only in this controlled asset-build step.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          args=()
          if [ "$CANDIDATE_ASSETS" = true ]; then
            args+=(--candidate)
          else
            test -n "$PUBLISHED_ASSET_IMAGE"
            args+=(--published-image "$PUBLISHED_ASSET_IMAGE")
          fi
          python scripts/prepare_ci_assets.py "${args[@]}" --env-output "$RUNNER_TEMP/asset-env"
          cat "$RUNNER_TEMP/asset-env" >> "$GITHUB_ENV"
      - name: Seed clean runtime cache twice without networking
        run: |
          mkdir -p "$PI_ASSET_CACHE"
          for pass in 1 2; do
            docker run --rm --network none \
              -v "$PI_ASSET_CACHE:/models" "$PI_ASSET_IMAGE" \
              --manifest-sha256 "$PI_ASSET_MANIFEST_SHA256"
          done
          # Source-image files may be root-only. Seed as root, then give only
          # this isolated runner cache back to the host test process.
          docker run --rm --network none --entrypoint chown \
            -v "$PI_ASSET_CACHE:/models" "$PI_ASSET_IMAGE" -R "$(id -u):$(id -g)" /models
          python - <<'PY'
          import os
          from pi_platform.deployment.offline_assets import configure
          configure()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key in ('PI_DOCLING_ASSET_ROOT', 'PI_DOCLING_TOKENIZER', 'PI_TRANSFORMERS_ASSET_ROOT'):
                  stream.write(key + '=' + os.environ[key] + '\n')
          PY
      - name: Install the hashed production dependency closure
        run: |
          python -m pip install --require-hashes -r requirements-production-linux-x86_64.txt -r requirements-production-java-linux-x86_64.txt
          python -m pip install --no-deps '.[production]'
          python -m pip check
      - name: Review licenses against the actual production closure
        run: python -m pi_platform.cli license-gate --inventory distribution/licenses/production-dependency-inventory.json --production-lock requirements-production-linux-x86_64.txt --license-review distribution/licenses/production-license-review.json --license-evidence distribution/licenses/production-license-evidence.json --sbom-output .
      - name: Start and verify the pinned GGUF CPU runtime
        run: python scripts/smoke_gguf_container.py --cache "$PI_ASSET_CACHE" --keep-running --name pi-runtime-ci --port 8769
      - name: Strict production capability gate (loads the configured model snapshot)
        run: python -m pi_platform.cli.production_capability_gate
      - name: Real embedding, ANN, and PDF regression suites
        run: |
          python -m unittest tests.test_embeddinggemma2_embedding_model tests.test_multimodal_gguf_runtime tests.test_usearch_dense_index tests.test_real_docling_binding tests.test_production_end_to_end tests.test_docling_production_binding -v
      - name: Normalize publication image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project-intelligence"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build production container and validate dependency installation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: production
          load: true
          tags: ${{ steps.image.outputs.name }}:production-candidate
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
      - name: Verify container imports against the locked stack
        run: |
          docker run --rm --entrypoint python '${{ steps.image.outputs.name }}:production-candidate' -m pip check
          docker run --rm --entrypoint python '${{ steps.image.outputs.name }}:production-candidate' -c 'import sentence_transformers, transformers, torch, usearch; from docling.document_converter import DocumentConverter; from transformers.models.embedding_gemma2 import EmbeddingGemma2Config'
      - name: Real offline installation and restart on an internal network
        run: |
          args=()
          if [ "$PI_ASSET_MODE" = candidate ]; then
            args+=(--candidate-assets --asset-image "$PI_ASSET_IMAGE" --manifest-sha256 "$PI_ASSET_MANIFEST_SHA256")
          else
            args+=(--asset-release "$PI_ASSET_RELEASE_FILE")
          fi
          python scripts/smoke_production_container.py --image '${{ steps.image.outputs.name }}:production-candidate' "${args[@]}"
      - name: Log in to GHCR for release publication
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified production artifact
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: production
          push: true
          tags: ${{ steps.image.outputs.name }}:production
          cache-from: type=gha,scope=production

      - name: Stop isolated inference runtime
        if: always()
        run: docker rm -f pi-runtime-ci || true
