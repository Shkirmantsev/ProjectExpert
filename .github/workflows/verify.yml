name: verify

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  full-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --global @fission-ai/openspec@1.12.0
      - run: python -m venv tmp/local/project-context/venv
      - run: tmp/local/project-context/venv/bin/python -m pip install -e tools/mcp/project-context-mcp
      - run: cp .env.example .env
      - run: python scripts/bootstrap_env.py
      - run: docker compose --env-file .env -f infra/compose.yaml --profile '*' config -q
      - run: python harness.py check-delegated


  full-windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --global @fission-ai/openspec@1.12.0
      - run: python harness.py mcp-install
      - run: Copy-Item .env.example .env
      - run: python scripts/bootstrap_env.py
      - name: Ensure GNU Make for native Windows command verification
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: make help PYTHON=python SHELL=cmd.exe
      - run: make wiki-init PYTHON=python SHELL=cmd.exe
      - run: python harness.py check-delegated
