name: verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests with stall diagnostics
        shell: python
        run: |
          import sys
          import threading
          import traceback
          import unittest
          class StallResult(unittest.TextTestResult):
              stall_interval = 120
              def startTest(self, test):
                  super().startTest(test)
                  self._stop_watchdog = threading.Event()
                  self._watchdog = threading.Thread(
                      target=self._report_stall,
                      args=(test.id(), threading.get_ident()), daemon=True)
                  self._watchdog.start()
              def _report_stall(self, test_id, thread_id):
                  while not self._stop_watchdog.wait(self.stall_interval):
                      print(f"\nSlow test: {test_id}", file=self.stream, flush=True)
                      # Hold Python frame references while formatting. Native
                      # asynchronous faulthandler dumps crashed Windows 3.11.
                      frame = sys._current_frames().get(thread_id)
                      if frame is not None:
                          traceback.print_stack(frame, file=self.stream)
                      self.stream.flush()
                      del frame
              def stopTest(self, test):
                  self._stop_watchdog.set()
                  self._watchdog.join()
                  super().stopTest(test)
          class StallRunner(unittest.TextTestRunner):
              resultclass = StallResult
          # Actions executes this script outside the checkout; set the import root.
          # Only the active slow test emits a stack sample; suite age is irrelevant.
          # The Actions job timeout still bounds stalls that hold the GIL.
          if __name__ == "__main__":
              unittest.main(module=None, testRunner=StallRunner, argv=["unittest", "discover", "-s", "tests", "-t", ".", "-v"])

  full-linux:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --global @fission-ai/openspec@1.12.0
      - run: python -m venv tmp/local/project-context/venv
      - run: tmp/local/project-context/venv/bin/python -m pip install -e tools/mcp/project-context-mcp
      - run: cp .env.example .env
      - run: python scripts/bootstrap_env.py
      - run: docker compose --env-file .env -f infra/compose.yaml --profile '*' config -q
      - run: python harness.py check-delegated


  full-windows:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --global @fission-ai/openspec@1.12.0
      - run: python harness.py mcp-install
      - run: Copy-Item .env.example .env
      - run: python scripts/bootstrap_env.py
      - name: Ensure GNU Make for native Windows command verification
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: make help PYTHON=python SHELL=cmd.exe
      - run: make wiki-init PYTHON=python SHELL=cmd.exe
      - run: python harness.py check-delegated
