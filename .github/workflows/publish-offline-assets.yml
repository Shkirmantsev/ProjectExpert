name: publish-offline-assets

# Called automatically by trusted merge/release pipelines. Manual execution is
# also available for diagnostics; no copied checksum input is required.
on:
  workflow_call:
    outputs:
      image:
        description: Verified immutable asset registry reference
        value: ${{ jobs.resolve-assets.outputs.image }}
      manifest_sha256:
        description: SHA-256 computed from the reviewed committed inventory
        value: ${{ jobs.resolve-assets.outputs.manifest_sha256 }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  resolve-assets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Serialize publishers across callers so simultaneous workflows reuse the
    # first successful content-keyed publication instead of downloading twice.
    concurrency:
      group: offline-assets-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.assets.outputs.PI_ASSET_IMAGE }}
      manifest_sha256: ${{ steps.assets.outputs.PI_ASSET_MANIFEST_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse matching models or build and publish the reviewed asset image
        id: assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/prepare_ci_assets.py --ensure-published \
            --env-output "$RUNNER_TEMP/asset-env" --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/asset-env" >> "$GITHUB_ENV"
      - name: Record immutable publication evidence
        run: |
          echo '### Automatically resolved offline models' >> "$GITHUB_STEP_SUMMARY"
          echo "Asset image: $PI_ASSET_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Computed inventory SHA-256: $PI_ASSET_MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo 'Application/kit promotion still requires the downstream real offline smoke and full tests.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-asset-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/local/ci-assets/*.json
          if-no-files-found: error
