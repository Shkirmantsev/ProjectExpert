[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "project-context-mcp"
version = "4.0.0"
description = "Local Markdown-first project context MCP server for harness-layout"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "anyio==4.10.0", "trio>=0.30,<1"]

[project.scripts]
project-context-mcp = "project_context_mcp.server:main"
project-context-index = "project_context_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_context_mcp*"]
