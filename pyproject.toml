[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-platform"
version = "0.1.0"
description = "Portable project intelligence with semantic search, MCP, REST and UI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["project-intelligence", "version-aware", "retrieval", "okf"]
authors = [{ name = "Project Intelligence Platform Contributors" }]

dependencies = [
    # Phase 1 ships Python standard-library only by default. The CI
    # license gate must approve further runtime dependencies. PyYAML is
    # declared as an optional dependency because the OKF v0.2 profile
    # benefits from it but the platform remains functional without it
    # (a minimal YAML subset parser is used as fallback).
]

[project.optional-dependencies]
yaml = ["PyYAML==6.0.3"]
java = ["tree-sitter==0.26.0", "tree-sitter-java==0.23.5"]
semantic-embeddings = ["torch==2.14.1", "sentence-transformers==6.1.0", "transformers==5.20.2", "huggingface-hub==1.33.0", "numpy==2.4.6"]
dense-ann = ["usearch==2.26.5", "numpy==2.4.6"]
documents = ["docling==2.140.0", "docling-core==2.103.1", "onnxruntime==1.31.0"]
production = ["tree-sitter-java==0.23.5", "PyYAML==6.0.3", "torch==2.14.1", "sentence-transformers==6.1.0", "transformers==5.20.2", "huggingface-hub==1.33.0", "usearch==2.26.5", "numpy==2.4.6", "docling==2.140.0", "docling-core==2.103.1", "onnxruntime==1.31.0"]
dev = ["pytest>=7.0"]

[project.scripts]
project-intelligence = "pi_platform.cli.main:main"

[tool.setuptools.packages.find]
include = ["pi_platform*"]

[tool.setuptools.package-data]
"pi_platform.adapters.ui" = ["static/*"]

[tool.setuptools.data-files]
"distribution/licenses" = ["distribution/licenses/dependency-inventory.json", "distribution/licenses/model-licenses.json", "distribution/licenses/production-dependency-inventory.json", "distribution/licenses/production-java-dependency-inventory.json", "distribution/licenses/production-license-evidence.json", "distribution/licenses/tree-sitter-LICENSE.txt", "distribution/licenses/tree-sitter-java-LICENSE.txt"]
"distribution/skills/project-intelligence" = ["distribution/skills/project-intelligence/SKILL.md"]
"distribution/skills/project-intelligence/references" = ["distribution/skills/project-intelligence/references/*.md"]
"distribution/okf-profile" = ["distribution/okf-profile/PROFILE.md"]
"distribution/okf-profile/template" = ["distribution/okf-profile/template/*.md"]

[tool.pytest.ini_options]
markers = [
  "local_model: Tier 2 local-model integration tests (tokenizer, embedding, ANN, reranker)",
  "pdf: Tier 2 PDF prescan, Docling adapter, table and figure fixture tests",
  "slow: Tier 2/3 long-document (600-page) and sweep integration tests",
]

