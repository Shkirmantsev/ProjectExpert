[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-platform"
version = "0.1.0"
description = "Phase 1 foundation of the v0.8 Project Intelligence Platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["project-intelligence", "version-aware", "retrieval", "okf"]
authors = [{ name = "Project Intelligence Platform Contributors" }]

dependencies = [
    # Phase 1 ships Python standard-library only by default. The CI
    # license gate must approve further runtime dependencies. PyYAML is
    # declared as an optional dependency because the OKF v0.2 profile
    # benefits from it but the platform remains functional without it
    # (a minimal YAML subset parser is used as fallback).
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
java = ["tree-sitter==0.25.2", "tree-sitter-java==0.23.5"]
semantic-embeddings = ["torch>=2.2", "sentence-transformers>=3.0", "transformers>=4.40", "huggingface-hub>=0.23", "numpy>=1.26"]
dense-ann = ["usearch>=2.12", "numpy>=1.26"]
documents = ["docling>=2.0", "docling-core>=2.0"]
production = ["PyYAML>=6.0", "torch>=2.2", "sentence-transformers>=3.0", "transformers>=4.40", "huggingface-hub>=0.23", "usearch>=2.12", "numpy>=1.26", "docling>=2.0", "docling-core>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
project-intelligence = "pi_platform.cli.main:main"

[tool.setuptools.packages.find]
include = ["pi_platform*"]

[tool.setuptools.package-data]
"pi_platform.adapters.ui" = ["static/*"]

[tool.setuptools.data-files]
"distribution/licenses" = ["distribution/licenses/dependency-inventory.json", "distribution/licenses/tree-sitter-LICENSE.txt", "distribution/licenses/tree-sitter-java-LICENSE.txt"]

[tool.pytest.ini_options]
markers = [
  "local_model: Tier 2 local-model integration tests (tokenizer, embedding, ANN, reranker)",
  "pdf: Tier 2 PDF prescan, Docling adapter, table and figure fixture tests",
  "slow: Tier 2/3 long-document (600-page) and sweep integration tests",
]

