# Managed llama.cpp sidecar for the pinned EmbeddingGemma 2 Q8_0 backbone and
# its Q8_0 multimodal projector. Combine with compose.cpu.yaml, compose.vulkan.yaml
# or compose.cuda.yaml, which supply the device (and the GPU fit budget).
# The runtime flags below are an explicit argument vector: llama.cpp's
# LLAMA_ARG_* environment names differ from the flag names and are silently
# ignored when wrong, so they are never relied upon here.
services:
  production:
    environment:
      PI_EMBEDDING_MODEL: gemma
      PI_LLAMA_ENDPOINT: http://embeddings:8769
      PI_LLAMA_API_KEY_FILE: /models/llama-api-key
    depends_on:
      model-setup:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
  model-setup:
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:production}
    platform: linux/amd64
    entrypoint: ["python", "-m", "pi_platform.cli.gguf_setup"]
    command: ["--cache", "/models", "--model", "gemma"]
    volumes:
      - model-cache:/models
    restart: "no"
  embeddings:
    # The always-present CPU runtime. The Vulkan overlay keeps this image and
    # adds the device passthrough; the CUDA overlay replaces it with the
    # CUDA build. The CPU overlay disables GPU device use entirely.
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11515@sha256:b7ac2b757dd43ab04fdc236b9e96a0020ba8566d0b8c33839add482e93c80f3b
    platform: linux/amd64
    volumes:
      - model-cache:/models:ro
    depends_on:
      model-setup:
        condition: service_completed_successfully
    # No published host port: only the application network can reach the service.
    # The multimodal projector always stays on the CPU (--no-mmproj-offload):
    # it is ~555 MB of Q8 weights plus runtime buffers and does not fit a small
    # UMA allocation safely. The backend overlay must be combined with this
    # file so the runtime receives its --device flags.
    command:
      - --embeddings
      - --model
      - /models/embeddinggemma-2-Q8_0.gguf
      - --mmproj
      - /models/mmproj-embeddinggemma-2-Q8_0.gguf
      - --alias
      - project-intelligence-gemma2-q8-2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135-c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f
      - --pooling
      - mean
      - --embd-normalize
      - "2"
      - --ctx-size
      - "2048"
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --parallel
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8769"
      - --api-key-file
      - /models/llama-api-key
      - --no-mmproj-offload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8769/health"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    restart: unless-stopped