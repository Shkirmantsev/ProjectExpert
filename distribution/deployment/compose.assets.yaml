# Optional candidate validation only. The default kit cannot use this until
# complete licensed assets and an actual immutable release digest are pinned.
services:
  asset-seed:
    image: ${PI_ASSET_IMAGE:?Set an immutable reviewed asset image digest}
    platform: linux/amd64
    command: ["--manifest-sha256", "${PI_ASSET_MANIFEST_SHA256:?Set reviewed manifest SHA-256}"]
    volumes:
      - model-cache:/models
    network_mode: none
    restart: "no"
