# Native Windows llama.cpp runtime (Gemma Q8_0 + Q8_0 projector); no Vulkan
# passthrough assumption. The native service is selected and started by
# setup-windows-accelerator.ps1 and reached through host.docker.internal:8769.
services:
  production:
    environment:
      PI_EMBEDDING_MODEL: gemma
      PI_EMBEDDING_DEVICE: ${PI_ACCELERATOR:-vulkan}
      PI_LLAMA_ENDPOINT: http://host.docker.internal:8769
      PI_LLAMA_API_KEY_FILE: /accelerator/llama-api-key
      PI_GGUF_CACHE: /accelerator
    volumes:
      - type: bind
        source: ./accelerator
        target: /accelerator
        read_only: true
        bind:
          create_host_path: false