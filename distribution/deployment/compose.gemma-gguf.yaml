# Apply after the accelerator backend overlay to select Gemma text/image embeddings.
services:
  production:
    environment:
      PI_EMBEDDING_MODEL: gemma-gguf
  model-setup:
    command: ["--cache", "/models", "--model", "gemma-gguf"]
  embeddings:
    environment:
      LLAMA_ARG_MODEL: /models/embeddinggemma-2-Q8_0.gguf
      LLAMA_ARG_MMPROJ: /models/mmproj-embeddinggemma-2-Q8_0.gguf
      LLAMA_ARG_ALIAS: project-intelligence-gemma2-q8-2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135-c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f
      LLAMA_ARG_POOLING: mean
