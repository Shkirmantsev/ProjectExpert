name: project-intelligence
services:
  production:
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:production}
    platform: linux/amd64
    # Enforce ownership even for image overrides or direct Compose invocation.
    entrypoint:
      - python
      - -c
      - |
        import os
        try:
            from pi_platform.adapters.fs.container_identity import prepare_project_user
        except ImportError:
            raise SystemExit("Incompatible ProjectExpert image: upgrade the application image and deployment kit; check PI_IMAGE. Project-owner execution is required.") from None
        host_ca_mode = os.environ.get("PI_HOST_CA_MODE", "auto")
        if host_ca_mode not in ("auto", "off"):
            raise SystemExit("PI_HOST_CA_MODE must be auto or off")
        trust_requested = host_ca_mode != "off" and (
            bool(os.environ.get("PI_EXTRA_CA_BUNDLE")) or
            os.path.isfile("/run/projectexpert-host-trust/host-ca-bundle.pem")
        )
        if trust_requested:
            try:
                from pi_platform.deployment.trust import configure_container_trust
            except ImportError:
                raise SystemExit("Incompatible ProjectExpert image: requested CA trust requires an application image and deployment kit upgrade; check PI_IMAGE. TLS verification has not been weakened.") from None
            configure_container_trust()
        os.environ["PI_RUN_AS_PROJECT_OWNER"] = "1"
        prepare_project_user(os.environ["PI_TARGET_ROOT"])
        from pi_platform.cli.main import main
        raise SystemExit(main())
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PI_BIND_HOST:-127.0.0.1}:${PI_CONTROL_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ${PI_TARGET_REPO:-..}
        target: /repo
        bind:
          create_host_path: false
      - model-cache:/models
    environment:
      PI_TARGET_ROOT: /repo
      PI_WORKSPACE_MODE: ${PI_WORKSPACE_MODE:-bind}
      PI_UI_TOKEN: ${PI_UI_TOKEN:-}
      PI_STARTUP_PROFILE: production
      PI_EMBEDDING_MODEL: ${PI_EMBEDDING_MODEL:-gemma}
      PI_EMBEDDING_DEVICE: ${PI_EMBEDDING_DEVICE:-cpu}
      PI_DENSE_INDEX: usearch
      PI_DOCLING_ENABLED: ${PI_DOCLING_ENABLED:-1}
      PI_PREPARE_DOCLING: "1"
      PI_INDEX_ENGINE: ${PI_INDEX_ENGINE:-legacy}
      PI_INDEX_PARALLEL: ${PI_INDEX_PARALLEL:-0}
      PI_INDEX_REQUIRE_COMPLETE: ${PI_INDEX_REQUIRE_COMPLETE:-1}
      PI_EMBED_BATCHING: ${PI_EMBED_BATCHING:-0}
      PI_CPU_TARGET_PERCENT: ${PI_CPU_TARGET_PERCENT:-80}
      PI_PARSE_WORKERS: ${PI_PARSE_WORKERS:-auto}
      PI_PDF_WORKERS: ${PI_PDF_WORKERS:-1}
      PI_PDF_THREADS: ${PI_PDF_THREADS:-1}
      PI_MODEL_CACHE: /models/huggingface
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      XDG_CACHE_HOME: /models/cache
    command: ["start", "--target", "/repo", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.5
    profiles: ["open-webui"]
    ports:
      - "${PI_BIND_HOST:-127.0.0.1}:${PI_OPEN_WEBUI_PORT:-8768}:8080"
    environment:
      OPENAI_API_BASE_URL: http://production:8765/v1
      OPENAI_API_KEY: ${PI_OPEN_WEBUI_API_KEY:-project-intelligence}
      ENABLE_OLLAMA_API: "false"
      WEBUI_NAME: ${PI_WEBUI_NAME:-Open WebUI}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      production:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4); assert json.load(r).get('status') is True"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
volumes:
  model-cache:
  open-webui-data:
