# CPU runtime profile. Overrides ONLY the device to none (the model, alias
# and pooling live in compose.accelerator.yaml and are never re-declared
# here). The multimodal projector stays on the CPU as well (the base command
# passes --no-mmproj-offload exactly once).
services:
  production:
    environment:
      PI_EMBEDDING_DEVICE: cpu
  embeddings:
    entrypoint: ["/app/llama-server", "--device", "none"]