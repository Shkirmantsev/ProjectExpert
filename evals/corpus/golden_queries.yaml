---
# evals/corpus/golden_queries.yaml
#
# The golden query set for the v0.8 Tier-3 evaluation command
# (Change Package J, plan §28). Every entry pairs a query with
# the canonical ground truth the retrieval pipeline is expected
# to surface. The fixture covers every documented sub-corpus so
# the eval command can run a single pass across the platform
# rather than a per-corpus loop.
#
# Conventions (per Change Package J / plan §28.3):
# - `id` is the operator-facing name; the eval command uses it
#   in its summary table.
# - `corpus` is one of {synthetic, generated-pdf, multilingual,
#   java, requirements}; the eval command resolves the sub-corpus
#   from the entry's `corpus` field.
# - `text` is the query string passed to the multi-stage
#   retrieval pipeline.
# - `ground_truth.chunk_ids` is the chunk-id set the pipeline
#   is expected to surface; `ground_truth.protected` is the set
#   of chunks that MUST survive the protected path (engineering
#   identifiers, quoted phrases, target symbols).
# - `tier` is 1 (deterministic, no model), 2 (local model, opt-in)
#   or 3 (full integration; the only one this YAML ships).
# - `tags` drive the per-tag breakdown in the eval report; they
#   mirror the plan §28.3 query taxonomy.

schema_version: "1"
generated_at: "2026-10-15"
tier_default: 3
recording_for: "improve-ingestion-retrieval-local-models / Package J"

queries:
  - id: identifier-ILO-5193
    corpus: synthetic
    text: "ILO-5193"
    ground_truth:
      chunk_ids: ["synthetic-chunk-ilo-5193", "synthetic-chunk-ilo-5193-spec"]
      protected: ["synthetic-chunk-ilo-5193"]
    tags: ["identifier", "protected"]
    tier: 1

  - id: mixed-identifier-with-text-ILO-5193
