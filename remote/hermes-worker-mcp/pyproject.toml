[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-native-claude-mcp"
version = "1.1.0"
description = "Dedicated Claude Code MCP control sidecar for a native remote Hermes Agent"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.0",
  "httpx==0.28.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.4"
]

[project.scripts]
hermes-worker-mcp = "hermes_worker_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]
