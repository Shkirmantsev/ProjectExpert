# Phase 9 docker-compose for the v0.8 Project Intelligence Platform.
#
# Profiles (per plan-v0-8-platform-architecture/tasks.md task 19 + design.md §45):
#   - core-headless      : the core container only — REST + UI served by the
#                          same image. Default for headless / CI usage.
#                          No model is started; ``query`` returns the
#                          retrieval-only result. The UI exposes a "Model
#                          settings" panel for operators who want to wire
#                          a remote model in.
#   - desktop-lite       : core + bundled local model sidecar. This is the
#                          §58 "download → start → open browser" default.
#                          The local model handles text retrieval and the
#                          OpenAI-compatible chat shim points at it by
#                          default. The UI settings panel may override.
#   - desktop-local-ai   : desktop-lite + a heavier local model (operator
#                          picks the runtime and the weights).
#   - open-webui         : desktop-lite + Open WebUI sidecar (pinned to
#                          0.6.5 from the SPDX inventory). The operator
#                          configures the model Open WebUI talks to.
#   - enterprise         : core + an OCI distribution sidecar placeholder.
#
# Phase 1 had a `desktop-ui` sidecar in the `desktop-lite` profile. Phase 9
# collapses that sidecar: the lightweight static UI is served by the core
# container itself, removing a redundant process and a duplicate image
# reference. This is documented as a Phase 1 contract reversal in
# design.md (§"Phase 1 contract reversal").
#
# Local model by default (ADR 0020): ``desktop-lite`` starts a small local
# model sidecar so the platform answers queries out of the box. The UI
# exposes a "Model settings" panel so operators can swap the endpoint to
# any OpenAI-compatible service without rebuilding the container.

name: project-intelligence

x-common-env: &common-env
  PI_PLATFORM_HOME: /opt/project-intelligence
  PI_DIST_LICENSES: /opt/project-intelligence/distribution/licenses
  PI_DIST_SBOM: /opt/project-intelligence/distribution/sbom
  PI_DIST_OKF: /opt/project-intelligence/distribution/okf-profile

services:
  core: &core
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:core}
    build:
      context: .
      dockerfile: Containerfile
      target: core
    profiles: ["core-headless", "desktop-lite", "desktop-local-ai", "open-webui", "enterprise"]
    ports:
      - "${PI_BIND_HOST:-127.0.0.1}:${PI_CONTROL_PORT:-8765}:8765"
    volumes:
      - ${PI_TARGET_REPO:-.}:/repo:rw
      - pi-model-cache:/models/huggingface:rw
    environment:
      <<: *common-env
      PI_TARGET_ROOT: /repo
      PI_STARTUP_PROFILE: minimal
      PI_EMBEDDING_MODEL: ${PI_EMBEDDING_MODEL:-hashing}
      PI_EMBEDDING_DEVICE: ${PI_EMBEDDING_DEVICE:-auto}
      PI_DENSE_INDEX: ${PI_DENSE_INDEX:-flat}
      PI_DOCLING_ENABLED: ${PI_DOCLING_ENABLED:-0}
      PI_MODEL_CACHE: ${PI_MODEL_CACHE:-/models/huggingface}
      HF_HOME: ${PI_MODEL_CACHE:-/models/huggingface}
      # ``PI_OPENAI_BASE_URL`` is the URL the OpenAI-compatible shim uses
      # when the operator has not yet overridden it from the UI. The
      # default points at the bundled local-llm sidecar in
      # ``desktop-lite`` and friends; ``core-headless`` overrides it to
      # the empty string to disable the chat path.
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-http://local-llm:8767/v1}
      PI_OPENAI_MODEL: ${PI_OPENAI_MODEL:-project-intelligence}
    restart: unless-stopped

  production:
    <<: *core
    platform: linux/amd64
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:production}
    build:
      context: .
      dockerfile: Containerfile
      target: production
    profiles: ["production"]
    environment:
      <<: *common-env
      PI_TARGET_ROOT: /repo
      PI_STARTUP_PROFILE: production
      PI_EMBEDDING_MODEL: ${PI_EMBEDDING_MODEL:-gemma}
      PI_EMBEDDING_DEVICE: ${PI_EMBEDDING_DEVICE:-auto}
      PI_DENSE_INDEX: ${PI_DENSE_INDEX:-usearch}
      PI_DOCLING_ENABLED: ${PI_DOCLING_ENABLED:-1}
      PI_MODEL_CACHE: ${PI_MODEL_CACHE:-/models/huggingface}
      HF_HOME: ${PI_MODEL_CACHE:-/models/huggingface}
      # Forward existing login only; never put a token in the image or YAML.
      HF_TOKEN: ${HF_TOKEN:-}
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-}
      PI_OPENAI_MODEL: ${PI_OPENAI_MODEL:-project-intelligence}

  local-llm:
    # Bundled local model sidecar (default). The image and the model file
    # are chosen by the operator via ``PI_LOCAL_LLM_IMAGE`` and
    # ``PI_LOCAL_LLM_MODEL``; ProjectExpert ships a stable llama.cpp
    # release tag and a placeholder model path that operators are expected
    # to override for their hardware and licence policy.
    image: ${PI_LOCAL_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:b3855}
    profiles: ["desktop-lite", "desktop-local-ai", "open-webui"]
    ports:
      - "${PI_LOCAL_LLM_PORT:-8767}:8767"
    volumes:
      - llm-models:/models:ro
    environment:
      LLAMA_ARG_MODEL: ${PI_LOCAL_LLM_MODEL:-/models/placeholder.gguf}
    restart: unless-stopped

  open-webui:
    # Optional Open WebUI sidecar. Pinned to 0.6.5 — the exact version
    # recorded in distribution/licenses/dependency-inventory.json (Block C3).
    # Re-verify the SPDX entry on every version bump before redistribution.
    # The model endpoint Open WebUI talks to is operator-supplied; teams
    # set ``OPENAI_API_BASE_URL`` in a project-local override file when
    # they want Open WebUI to use a specific model.
    image: ghcr.io/open-webui/open-webui:0.6.5
    profiles: ["open-webui"]
    ports:
      - "${PI_OPEN_WEBUI_PORT:-8768}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  enterprise-sidecar:
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:core}
    profiles: ["enterprise"]
    depends_on:
      - core
    environment:
      <<: *common-env
      PI_MODE: enterprise-sidecar
    restart: unless-stopped

volumes:
  pi-model-cache:
  llm-models:
  open-webui-data: