# Phase 9 docker-compose for the v0.8 Project Intelligence Platform.
#
# Profiles:
#   core-headless: model-free development retrieval and the static UI.
#   desktop-lite / desktop-local-ai: legacy opt-in chat sidecar profiles;
#     operators must supply weights. No chat model is wired into search.
#   open-webui: core retrieval adapter plus the optional chat-style frontend.
#     Search requires no chat LLM. Configure Open WebUI with core:8765/v1
#     and the project-intelligence model when using this topology.
#   production: native Gemma semantic retrieval. The exported deployment kit
#     manages a separate Gemma embedding sidecar instead.
#   enterprise: core and an optional distribution sidecar.

name: project-intelligence

x-common-env: &common-env
  PI_PLATFORM_HOME: /opt/project-intelligence
  PI_DIST_LICENSES: /opt/project-intelligence/distribution/licenses
  PI_DIST_SBOM: /opt/project-intelligence/distribution/sbom
  PI_DIST_OKF: /opt/project-intelligence/distribution/okf-profile

services:
  core: &core
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:core}
    build:
      context: .
      dockerfile: Containerfile
      target: core
    entrypoint:
      - python
      - -c
      - |
        import os
        try:
            from pi_platform.adapters.fs.container_identity import prepare_project_user
        except ImportError:
            raise SystemExit("Incompatible ProjectExpert image: upgrade the application image and deployment kit; check PI_IMAGE. Project-owner execution is required.") from None
        os.environ["PI_RUN_AS_PROJECT_OWNER"] = "1"
        prepare_project_user(os.environ["PI_TARGET_ROOT"])
        from pi_platform.cli.main import main
        raise SystemExit(main())
    # An explicit entrypoint suppresses image CMD in Compose.
    command: ["serve", "--target", "/repo", "--host", "0.0.0.0", "--port", "8765"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["core-headless", "desktop-lite", "desktop-local-ai", "open-webui", "enterprise"]
    ports:
      - "${PI_BIND_HOST:-127.0.0.1}:${PI_CONTROL_PORT:-8765}:8765"
    volumes:
      - ${PI_TARGET_REPO:-.}:/repo:rw
      - pi-model-cache:/models/huggingface:rw
    environment:
      <<: *common-env
      PI_TARGET_ROOT: /repo
      PI_STARTUP_PROFILE: minimal
      PI_EMBEDDING_MODEL: ${PI_EMBEDDING_MODEL:-hashing}
      PI_EMBEDDING_DEVICE: ${PI_EMBEDDING_DEVICE:-auto}
      PI_DENSE_INDEX: ${PI_DENSE_INDEX:-flat}
      PI_DOCLING_ENABLED: ${PI_DOCLING_ENABLED:-0}
      PI_MODEL_CACHE: ${PI_MODEL_CACHE:-/models/huggingface}
      HF_HOME: ${PI_MODEL_CACHE:-/models/huggingface}
      # Legacy adapter metadata only; this does not connect an upstream LLM.
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-http://core:8765/v1}
      PI_OPENAI_MODEL: ${PI_OPENAI_MODEL:-project-intelligence}
    restart: unless-stopped

  production:
    <<: *core
    platform: linux/amd64
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:production}
    build:
      context: .
      dockerfile: Containerfile
      target: production
    profiles: ["production"]
    environment:
      <<: *common-env
      PI_TARGET_ROOT: /repo
      PI_STARTUP_PROFILE: production
      PI_EMBEDDING_MODEL: ${PI_EMBEDDING_MODEL:-gemma-torch}
      PI_EMBEDDING_DEVICE: ${PI_EMBEDDING_DEVICE:-auto}
      PI_DENSE_INDEX: ${PI_DENSE_INDEX:-usearch}
      PI_DOCLING_ENABLED: ${PI_DOCLING_ENABLED:-1}
      PI_MODEL_CACHE: ${PI_MODEL_CACHE:-/models/huggingface}
      HF_HOME: ${PI_MODEL_CACHE:-/models/huggingface}
      # Forward existing login only; never put a token in the image or YAML.
      HF_TOKEN: ${HF_TOKEN:-}
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-}
      PI_OPENAI_MODEL: ${PI_OPENAI_MODEL:-project-intelligence}

  local-llm:
    # Legacy opt-in chat sidecar; not required by the open-webui profile. The image and the model file
    # are chosen by the operator via ``PI_LOCAL_LLM_IMAGE`` and
    # ``PI_LOCAL_LLM_MODEL``; ProjectExpert ships a stable llama.cpp
    # release tag and a placeholder model path that operators are expected
    # to override for their hardware and licence policy.
    image: ${PI_LOCAL_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:b3855}
    profiles: ["desktop-lite", "desktop-local-ai"]
    ports:
      - "${PI_LOCAL_LLM_PORT:-8767}:8767"
    volumes:
      - llm-models:/models:ro
    environment:
      LLAMA_ARG_MODEL: ${PI_LOCAL_LLM_MODEL:-/models/placeholder.gguf}
    restart: unless-stopped

  open-webui:
    # Optional Open WebUI sidecar. Pinned to 0.6.5 — the exact version
    # recorded in distribution/licenses/dependency-inventory.json (Block C3).
    # Re-verify the SPDX entry on every version bump before redistribution.
    # Use the project-aware adapter; optional upstream chat is configured
    # through ProjectExpert's own UI and shared server-side settings.
    image: ghcr.io/open-webui/open-webui:0.6.5
    profiles: ["open-webui"]
    ports:
      - "${PI_BIND_HOST:-127.0.0.1}:${PI_OPEN_WEBUI_PORT:-8768}:8080"
    environment:
      OPENAI_API_BASE_URL: http://core:8765/v1
      OPENAI_API_KEY: ${PI_OPEN_WEBUI_API_KEY:-project-intelligence}
      ENABLE_OLLAMA_API: "false"
      WEBUI_NAME: ${PI_WEBUI_NAME:-Open WebUI}
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4); assert json.load(r).get('status') is True"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  enterprise-sidecar:
    image: ${PI_IMAGE:-ghcr.io/shkirmantsev/project-intelligence:core}
    profiles: ["enterprise"]
    depends_on:
      - core
    environment:
      <<: *common-env
      PI_MODE: enterprise-sidecar
    restart: unless-stopped

volumes:
  pi-model-cache:
  llm-models:
  open-webui-data:
